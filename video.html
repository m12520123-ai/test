<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Golf AI 影片分析</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script></head><body><main class="wrap"><h1>⛳ Golf AI 影片分析</h1><div class="sub">v1.2｜選擇既有影片進行分析</div><nav class="tabs">
<a class="" href="index.html">📷 即時分析</a>
<a class="active" href="video.html">🎞️ 影片分析</a>
<a class="" href="trajectory.html">📐 彈道／速度</a>
</nav><section class="card"><label>拍攝視角</label><select id="view"><option>正面 Face-on</option><option>後方 Down-the-line</option></select><label>選擇影片</label><input id="file" type="file" accept="video/*,.mov,.mp4"><div class="stage"><video id="video" controls playsinline preload="metadata"></video><canvas id="overlay"></canvas></div><div class="controls"><button id="start" disabled>開始分析</button><button id="pause" class="secondary" disabled>暫停</button><button id="prev" class="secondary" disabled>上一格</button><button id="next" class="secondary" disabled>下一格</button></div><div id="status" class="status">請選擇影片。</div></section><section class="card"><div class="section-title">目前畫面數據</div><div class="grid"><div class="metric">左手肘<b id="le">—</b></div><div class="metric">右手肘<b id="re">—</b></div><div class="metric">左膝<b id="lk">—</b></div><div class="metric">右膝<b id="rk">—</b></div><div class="metric">軀幹傾角<b id="sp">—</b></div><div class="metric">頭部偏移<b id="hd">—</b></div></div></section></main><script>
const $=i=>document.getElementById(i),v=$('video'),c=$('overlay'),x=c.getContext('2d');let pose=null,run=false,busy=false,url=null,base=null;
function ang(a,b,d){let ux=a.x-b.x,uy=a.y-b.y,vx=d.x-b.x,vy=d.y-b.y,z=Math.hypot(ux,uy)*Math.hypot(vx,vy);return z?Math.acos(Math.max(-1,Math.min(1,(ux*vx+uy*vy)/z)))*180/Math.PI:NaN}function m(i,n,d=0){$(i).textContent=Number.isFinite(n)?n.toFixed(d):'—'}
$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);v.src=url;v.load();['start','pause','prev','next'].forEach(i=>$(i).disabled=false);$('status').textContent='影片已載入，可以開始分析。'};
function init(){if(pose)return true;if(typeof Pose==='undefined'){$('status').textContent='MediaPipe 未載入';return false}pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f});pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.45,minTrackingConfidence:.45});pose.onResults(r=>{busy=false;c.width=v.videoWidth||1;c.height=v.videoHeight||1;x.clearRect(0,0,c.width,c.height);let l=r.poseLandmarks;if(!l){$('status').textContent='未偵測到完整人體';return}drawConnectors(x,l,POSE_CONNECTIONS,{lineWidth:3});drawLandmarks(x,l,{radius:3});m('le',ang(l[11],l[13],l[15]));m('re',ang(l[12],l[14],l[16]));m('lk',ang(l[23],l[25],l[27]));m('rk',ang(l[24],l[26],l[28]));let s={x:(l[11].x+l[12].x)/2,y:(l[11].y+l[12].y)/2},h={x:(l[23].x+l[24].x)/2,y:(l[23].y+l[24].y)/2};m('sp',Math.atan2(Math.abs(s.x-h.x),Math.abs(s.y-h.y))*180/Math.PI);if(base===null)base=l[0].x;m('hd',Math.abs(l[0].x-base)*100,1);$('status').textContent='分析中…'});return true}async function send(){if(!pose||busy||v.readyState<2)return;busy=true;try{await pose.send({image:v})}catch(e){busy=false}}async function loop(){if(!run)return;await send();requestAnimationFrame(loop)}
$('start').onclick=async()=>{if(!init())return;base=null;run=true;try{await v.play()}catch(e){}loop()};$('pause').onclick=()=>{run=false;v.pause()};async function step(d){run=false;v.pause();if(!init())return;v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d/30));setTimeout(send,120)}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
</script></body></html>
