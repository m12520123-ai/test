<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golf AI v0.7</title><link rel="stylesheet" href="shared.css">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head><body><main class="wrap">
<h1>⛳ Golf AI</h1><div class="sub">v0.7｜揮桿分析＋擊球數據＋同步錄影</div>
<nav class="nav"><a class="active" href="index.html">揮桿分析</a><a href="shot.html">擊球數據</a><a href="record.html">同步錄影</a></nav>
<section class="card">
<label>拍攝視角</label><select id="view"><option value="face">正面 Face-on</option><option value="dtl">後方 Down-the-line</option></select>
<input id="file" type="file" accept="video/*,.mov,.mp4,video/quicktime,video/mp4">
<div class="stage"><video id="video" controls playsinline webkit-playsinline preload="metadata"></video><canvas id="canvas" class="overlay"></canvas></div>
<div class="controls"><button id="start" disabled>開始分析</button><button id="reset" class="secondary" disabled>重設</button><button id="prev" class="secondary" disabled>上一格</button><button id="next" class="secondary" disabled>下一格</button></div>
<div id="status" class="status">請選擇揮桿影片。</div><div id="meta" class="badge">尚未載入影片</div><div id="debug" class="debug">系統狀態：READY</div>
</section>
<section class="card"><div class="grid">
<div class="metric">左手肘<b id="le">—</b><span class="small">度</span></div><div class="metric">右手肘<b id="re">—</b><span class="small">度</span></div>
<div class="metric">左膝<b id="lk">—</b><span class="small">度</span></div><div class="metric">右膝<b id="rk">—</b><span class="small">度</span></div>
<div class="metric">軀幹傾角<b id="sp">—</b><span class="small">相對垂直線</span></div><div class="metric">頭部偏移<b id="hd">—</b><span class="small">畫面寬度 %</span></div>
</div></section></main>
<script>
(function(){"use strict";
const $=id=>document.getElementById(id),v=$("video"),c=$("canvas"),ctx=c.getContext("2d");let objectUrl=null,pose=null,running=false,busy=false,baseNose=null;
function status(t,cls=""){$("status").textContent=t;$("status").className="status "+cls}function debug(t){$("debug").textContent="系統狀態："+t}
function enable(on){["start","reset","prev","next"].forEach(id=>$(id).disabled=!on)}function clearMetrics(){["le","re","lk","rk","sp","hd"].forEach(id=>$(id).textContent="—")}
function setMetric(id,x){$(id).textContent=Number.isFinite(x)?Math.round(x):"—"}function angle(a,b,d){const ux=a.x-b.x,uy=a.y-b.y,vx=d.x-b.x,vy=d.y-b.y,den=Math.hypot(ux,uy)*Math.hypot(vx,vy);if(!den)return NaN;const cs=Math.max(-1,Math.min(1,(ux*vx+uy*vy)/den));return Math.acos(cs)*180/Math.PI}
$("file").addEventListener("change",function(e){const f=e.target.files&&e.target.files[0];clearMetrics();running=false;baseNose=null;if(!f){enable(false);status("請選擇影片。");return}
if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);v.src=objectUrl;v.load();enable(true);$("meta").textContent=f.name+"｜"+(f.size/1024/1024).toFixed(1)+" MB";status("已選擇影片，正在讀取…","ok");debug("FILE_SELECTED");
v.onloadedmetadata=function(){$("meta").textContent=f.name+"｜"+(f.size/1024/1024).toFixed(1)+" MB｜"+(v.duration||0).toFixed(2)+" 秒";status("影片已載入，可以開始分析。","ok");debug("VIDEO_METADATA_OK")};v.oncanplay=function(){debug("VIDEO_CAN_PLAY")}});
function initPose(){if(pose)return true;if(typeof Pose==="undefined"){status("MediaPipe Pose 腳本未載入。","err");debug("POSE_SCRIPT_NOT_LOADED");return false}
pose=new Pose({locateFile:file=>"https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file});pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.45,minTrackingConfidence:.45});pose.onResults(onResults);debug("POSE_READY");return true}
function onResults(results){busy=false;c.width=v.videoWidth||1;c.height=v.videoHeight||1;ctx.clearRect(0,0,c.width,c.height);const lm=results.poseLandmarks;if(!lm){status("目前畫面未偵測到完整人體。");return}
drawConnectors(ctx,lm,POSE_CONNECTIONS,{lineWidth:3});drawLandmarks(ctx,lm,{radius:3});setMetric("le",angle(lm[11],lm[13],lm[15]));setMetric("re",angle(lm[12],lm[14],lm[16]));setMetric("lk",angle(lm[23],lm[25],lm[27]));setMetric("rk",angle(lm[24],lm[26],lm[28]));
const sh={x:(lm[11].x+lm[12].x)/2,y:(lm[11].y+lm[12].y)/2},hp={x:(lm[23].x+lm[24].x)/2,y:(lm[23].y+lm[24].y)/2};setMetric("sp",Math.atan2(Math.abs(sh.x-hp.x),Math.abs(sh.y-hp.y))*180/Math.PI);if(baseNose===null)baseNose=lm[0].x;setMetric("hd",Math.abs(lm[0].x-baseNose)*100);status("已偵測到人體，分析正常。","ok")}
async function sendFrame(){if(!pose||busy||v.readyState<2)return;busy=true;try{await pose.send({image:v})}catch(e){busy=false;status("姿態分析失敗："+e.message,"err");debug("POSE_SEND_ERROR")}}
async function loop(){if(!running)return;await sendFrame();requestAnimationFrame(loop)}
$("start").onclick=async()=>{if(v.readyState<2){status("影片尚未可播放。","err");return}if(!initPose())return;baseNose=null;running=true;try{await v.play()}catch(e){}status("分析中…","ok");debug("ANALYZING");requestAnimationFrame(loop)};
$("reset").onclick=()=>{running=false;v.pause();v.currentTime=0;baseNose=null;busy=false;ctx.clearRect(0,0,c.width,c.height);clearMetrics();status("已重設。");debug("RESET")};
async function step(d){running=false;v.pause();if(!initPose())return;if(v.readyState<2)return;v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+d/30));setTimeout(sendFrame,120)}
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1)})();
</script></body></html>
