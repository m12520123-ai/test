<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>擊球數據</title><link rel="stylesheet" href="shared.css"></head><body><main class="wrap">
<h1>📈 擊球數據</h1><div class="sub">記錄每一球、估算彈道並保存歷史紀錄</div>
<nav class="nav"><a href="index.html">揮桿分析</a><a class="active" href="shot.html">擊球數據</a><a href="record.html">同步錄影</a></nav>
<div class="notice">目前手機網頁版沒有雷達硬體，球速／桿速／距離需手動輸入或未來串接外部感測器；不會假裝由手機鏡頭精準量出。</div>
<section class="card"><div class="row"><div><label>球速 Ball Speed (mph)</label><input id="ball" type="number" step="0.1" placeholder="例如 145"></div><div><label>桿頭速度 Club Speed (mph)</label><input id="club" type="number" step="0.1" placeholder="例如 100"></div></div>
<div class="row"><div><label>起飛角 Launch Angle (°)</label><input id="launch" type="number" step="0.1" value="14"></div><div><label>Carry (yards)</label><input id="carry" type="number" step="1" placeholder="例如 245"></div></div>
<label>球路</label><select id="shape"><option>直球 Straight</option><option>小右曲 Fade</option><option>大右曲 Slice</option><option>小左曲 Draw</option><option>大左曲 Hook</option></select><button id="calc">建立這一球</button></section>
<section class="card"><div class="grid"><div class="metric">Smash Factor<b id="smash">—</b><span class="small">球速 ÷ 桿速</span></div><div class="metric">Carry<b id="carryShow">—</b><span class="small">yards</span></div></div><canvas id="chart" class="chart" width="800" height="360"></canvas></section>
<section class="card"><h3>最近擊球</h3><div id="history" class="list"></div><button class="secondary" id="clear">清除紀錄</button></section></main>
<script>
const $=id=>document.getElementById(id),chart=$("chart"),ctx=chart.getContext("2d");
function drawTrajectory(carry,angle){ctx.clearRect(0,0,chart.width,chart.height);ctx.strokeStyle="#d9ded9";ctx.lineWidth=1;for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(50,i*60);ctx.lineTo(760,i*60);ctx.stroke()}
ctx.strokeStyle="#17201a";ctx.lineWidth=4;ctx.beginPath();const rad=angle*Math.PI/180,h=Math.max(40,Math.min(240,carry*Math.tan(rad)*.7));for(let i=0;i<=100;i++){const t=i/100,x=50+t*700,y=310-4*h*t*(1-t);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.fillStyle="#17201a";ctx.font="24px -apple-system";ctx.fillText(carry+" yd",660,335)}
function render(){const arr=JSON.parse(localStorage.getItem("golfShots")||"[]");$("history").innerHTML=arr.length?arr.slice().reverse().map(s=>`<div class="shot"><b>${s.time}</b>　${s.shape}<br><span class="small">Ball ${s.ball||"—"} mph｜Club ${s.club||"—"} mph｜Smash ${s.smash||"—"}｜Carry ${s.carry||"—"} yd｜Launch ${s.launch}°</span></div>`).join(""):"<span class='small'>尚無紀錄</span>"}
$("calc").onclick=()=>{const ball=parseFloat($("ball").value),club=parseFloat($("club").value),launch=parseFloat($("launch").value)||14,carry=parseFloat($("carry").value)||0,smash=(ball&&club)?(ball/club).toFixed(2):"—";$("smash").textContent=smash;$("carryShow").textContent=carry||"—";drawTrajectory(carry||200,launch);const arr=JSON.parse(localStorage.getItem("golfShots")||"[]");arr.push({time:new Date().toLocaleString(),ball:ball||"",club:club||"",launch,carry:carry||"",smash,shape:$("shape").value});localStorage.setItem("golfShots",JSON.stringify(arr.slice(-30)));render()}
$("clear").onclick=()=>{localStorage.removeItem("golfShots");render();ctx.clearRect(0,0,chart.width,chart.height)};render();drawTrajectory(220,14);
</script></body></html>
