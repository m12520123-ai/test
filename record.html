<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同步錄影與單球紀錄</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<main class="wrap">
<h1>🎥 同步錄影</h1>
<div class="sub">v0.8｜錄完自動建立 Shot，影片＋數據同頁顯示</div>

<nav class="nav">
<a href="index.html">揮桿分析</a>
<a href="shot.html">擊球數據</a>
<a class="active" href="record.html">同步錄影</a>
</nav>

<div class="notice">
目前手機本身無法像專業雷達一樣精準量出球速、桿速與 Carry。
錄影會自動建立 Shot 編號；擊球數據可手動輸入，之後可再串外部感測器。
</div>

<section class="card">
<label>拍攝視角</label>
<select id="view">
<option value="face">正面 Face-on</option>
<option value="dtl">後方 Down-the-line</option>
</select>

<label>鏡頭</label>
<select id="facing">
<option value="environment">後鏡頭</option>
<option value="user">前鏡頭</option>
</select>

<div class="stage">
<video id="preview" playsinline webkit-playsinline autoplay muted></video>
</div>

<div id="count" class="countdown"></div>

<div class="controls">
<button id="camera">開啟相機</button>
<button id="record" disabled>3 秒後開始錄影</button>
<button id="stop" class="secondary" disabled>停止錄影</button>
<button id="newshot" class="secondary" disabled>下一球</button>
</div>

<div id="status" class="status">尚未開啟相機。</div>
</section>

<section class="card" id="currentCard" style="display:none">
<h2 id="shotTitle">Shot 1</h2>

<div class="stage">
<video id="playback" controls playsinline></video>
</div>

<div class="row">
<div>
<label>球速 Ball Speed (mph)</label>
<input id="ball" type="number" step="0.1" placeholder="例如 145">
</div>
<div>
<label>桿頭速度 Club Speed (mph)</label>
<input id="club" type="number" step="0.1" placeholder="例如 100">
</div>
</div>

<div class="row">
<div>
<label>Launch Angle (°)</label>
<input id="launch" type="number" step="0.1" placeholder="例如 14">
</div>
<div>
<label>Carry (yards)</label>
<input id="carry" type="number" step="1" placeholder="例如 245">
</div>
</div>

<label>球路</label>
<select id="shape">
<option>直球 Straight</option>
<option>小右曲 Fade</option>
<option>大右曲 Slice</option>
<option>小左曲 Draw</option>
<option>大左曲 Hook</option>
</select>

<div class="grid">
<div class="metric">Smash Factor<b id="smash">—</b><span class="small">球速 ÷ 桿速</span></div>
<div class="metric">Shot 編號<b id="shotNo">—</b><span class="small">本次練習</span></div>
</div>

<button id="saveShot">儲存這一球</button>
<a id="downloadVideo" style="display:none"><button class="secondary">另存影片</button></a>
</section>

<section class="card">
<h3>本次練習紀錄</h3>
<div id="sessionList" class="list"></div>
<button id="clearSession" class="secondary">清除本次紀錄</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let stream=null, rec=null, chunks=[], currentBlob=null, currentUrl=null, currentShotNo=1;

function getSession(){
  return JSON.parse(localStorage.getItem("golfSessionShots")||"[]");
}
function setSession(arr){
  localStorage.setItem("golfSessionShots",JSON.stringify(arr));
}
function nextShotNumber(){
  const arr=getSession();
  return arr.length ? Math.max(...arr.map(x=>x.no||0))+1 : 1;
}
function calcSmash(){
  const ball=parseFloat($("ball").value), club=parseFloat($("club").value);
  $("smash").textContent=(ball&&club)?(ball/club).toFixed(2):"—";
}
$("ball").addEventListener("input",calcSmash);
$("club").addEventListener("input",calcSmash);

function renderSession(){
  const arr=getSession();
  $("sessionList").innerHTML=arr.length ? arr.slice().reverse().map(s=>`
    <div class="shot">
      <b>Shot ${s.no}</b>　${s.view==="face"?"Face-on":"Down-the-line"}　${s.shape}<br>
      <span class="small">
      Ball ${s.ball||"—"} mph｜Club ${s.club||"—"} mph｜Smash ${s.smash||"—"}｜
      Carry ${s.carry||"—"} yd｜Launch ${s.launch||"—"}°
      </span>
    </div>`).join("") : "<span class='small'>尚無紀錄</span>";
}

async function openCam(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      $("status").textContent="此瀏覽器不支援網頁相機功能。";
      return;
    }
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:$("facing").value}},
      audio:false
    });
    $("preview").srcObject=stream;
    $("record").disabled=false;
    $("status").textContent="相機已開啟，可以開始錄影。";
  }catch(e){
    $("status").textContent="無法開啟相機："+e.message;
  }
}

$("camera").onclick=openCam;
$("facing").onchange=()=>{ if(stream) openCam(); };

$("record").onclick=async()=>{
  if(!stream) return;
  $("record").disabled=true;
  $("newshot").disabled=true;
  $("currentCard").style.display="none";

  for(let n=3;n>=1;n--){
    $("count").textContent=n;
    await new Promise(r=>setTimeout(r,1000));
  }
  $("count").textContent="GO";
  setTimeout(()=>$("count").textContent="",500);

  chunks=[];
  let mime="";
  const candidates=["video/mp4;codecs=h264","video/mp4","video/webm;codecs=vp9","video/webm"];
  for(const m of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)){ mime=m; break; }
  }

  try{
    rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  }catch(e){
    try{ rec=new MediaRecorder(stream); }
    catch(err){
      $("status").textContent="此 Safari 版本無法使用網頁錄影："+err.message;
      $("record").disabled=false;
      return;
    }
  }

  rec.ondataavailable=e=>{
    if(e.data && e.data.size) chunks.push(e.data);
  };

  rec.onstop=()=>{
    currentBlob=new Blob(chunks,{type:rec.mimeType||"video/mp4"});
    if(currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl=URL.createObjectURL(currentBlob);

    currentShotNo=nextShotNumber();
    $("shotTitle").textContent="Shot "+currentShotNo;
    $("shotNo").textContent=currentShotNo;
    $("playback").src=currentUrl;

    const ext=currentBlob.type.includes("webm")?"webm":"mp4";
    $("downloadVideo").href=currentUrl;
    $("downloadVideo").download="Shot-"+currentShotNo+"."+ext;
    $("downloadVideo").style.display="block";

    $("ball").value="";
    $("club").value="";
    $("launch").value="";
    $("carry").value="";
    $("shape").selectedIndex=0;
    $("smash").textContent="—";

    $("currentCard").style.display="block";
    $("newshot").disabled=false;
    $("record").disabled=false;
    $("status").textContent="錄影完成，已自動建立 Shot "+currentShotNo+"。";
    window.scrollTo({top:$("currentCard").offsetTop-20,behavior:"smooth"});
  };

  rec.start();
  $("stop").disabled=false;
  $("status").textContent="錄影中…";
};

$("stop").onclick=()=>{
  if(rec && rec.state!=="inactive") rec.stop();
  $("stop").disabled=true;
};

$("saveShot").onclick=()=>{
  if(!currentBlob){
    $("status").textContent="目前沒有可儲存的揮桿影片。";
    return;
  }
  const ball=parseFloat($("ball").value)||null;
  const club=parseFloat($("club").value)||null;
  const launch=parseFloat($("launch").value)||null;
  const carry=parseFloat($("carry").value)||null;
  const smash=(ball&&club)?(ball/club).toFixed(2):null;

  const arr=getSession();
  const existing=arr.findIndex(x=>x.no===currentShotNo);
  const item={
    no:currentShotNo,
    time:new Date().toLocaleString(),
    view:$("view").value,
    ball,club,launch,carry,smash,
    shape:$("shape").value
  };
  if(existing>=0) arr[existing]=item; else arr.push(item);
  setSession(arr);

  // 同步到原本 shot.html 使用的歷史資料
  const hist=JSON.parse(localStorage.getItem("golfShots")||"[]");
  hist.push({
    time:item.time,ball:item.ball||"",club:item.club||"",
    launch:item.launch||"",carry:item.carry||"",
    smash:item.smash||"—",shape:item.shape
  });
  localStorage.setItem("golfShots",JSON.stringify(hist.slice(-30)));

  renderSession();
  $("status").textContent="Shot "+currentShotNo+" 已儲存。";
};

$("newshot").onclick=()=>{
  $("currentCard").style.display="none";
  $("status").textContent="準備下一球。按「3 秒後開始錄影」。";
  window.scrollTo({top:0,behavior:"smooth"});
};

$("clearSession").onclick=()=>{
  localStorage.removeItem("golfSessionShots");
  renderSession();
};

renderSession();
</script>
</body>
</html>
